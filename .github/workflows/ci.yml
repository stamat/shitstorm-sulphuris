name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # test/build.test.js runs the build and asserts the dist files exist, so
      # this matrix doubles as a cross-platform check of Poops itself
      - name: Test
        run: npm test

      # Browser-support gates on the emitted bundles: stylelint checks the CSS
      # against .browserslistrc, es-check confirms the JS parses at the esbuild
      # target. Both read dist/, which is gitignored, so they can only run after
      # the build — which the test step above performs.
      - name: Check browser compatibility
        shell: bash
        run: |
          npm run lint:browsers
          npm run lint:es
